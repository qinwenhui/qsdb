[workspace]
resolver = "2"
members = ["crates/qsdb", "crates/qsdb-cli", "crates/qsdb-bench"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/qinwenhui/qsdb"

[workspace.dependencies]
# 内存模型与文件格式（唯二重依赖，版本严格同步）
arrow = "60"
parquet = { version = "60", default-features = false, features = ["arrow", "zstd", "snap"] }

# 元数据
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["use-std"] }

# 基础
thiserror = "2"
tracing = "0.1"
rayon = "1"
hashbrown = "0.17"
fs2 = "0.4"
uuid = { version = "1", features = ["v7"] }
windows-sys = { version = "0.60", features = ["Win32_Storage_FileSystem", "Win32_Foundation"] }

# 前端/门面
sqlparser = "0.63"
clap = { version = "4", features = ["derive"] }
rustyline = "18"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "signal"] }

# 内部 crate
qsdb = { path = "crates/qsdb" }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"

# 基准构建：快编译 + 可观测
[profile.bench-release]
inherits = "release"
debug = "line-tables-only"
lto = "off"
codegen-units = 16
