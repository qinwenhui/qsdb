[package]
name = "qsdb-bench"
description = "QSDB macro benchmarks (scan / metadata / write)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "qsdb-bench"
path = "src/main.rs"

[dependencies]
qsdb = { workspace = true }
arrow = { workspace = true }
parquet = { workspace = true }
rayon = { workspace = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.60", features = ["Win32_System_ProcessStatus", "Win32_System_Threading"] }

[features]
# DuckDB 进程内对比（bundled 编译 C++，首次编译数分钟）
duckdb = ["dep:duckdb"]

[dependencies.duckdb]
version = "1.1"
optional = true
features = ["bundled"]
